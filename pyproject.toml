[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessmith"
dynamic = ["version"]
description = "Compile canonical Agent Skills into deterministic, harness-aware packages"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Glover" }]
keywords = ["agent-skills", "ai-agents", "compiler", "codex", "cursor"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "jsonschema>=4.23,<5",
  "mypy>=1.13,<2",
  "ruff>=0.8,<1",
  "twine>=6,<7",
]

[project.scripts]
harnessmith = "harnessmith.cli:main"

[project.urls]
Homepage = "https://github.com/kevinglover/harnessmith"
Issues = "https://github.com/kevinglover/harnessmith/issues"
Repository = "https://github.com/kevinglover/harnessmith.git"

[tool.setuptools.dynamic]
version = { attr = "harnessmith.__version__" }

[tool.setuptools.packages.find]
include = ["harnessmith*"]

[tool.coverage.run]
branch = true
source = ["harnessmith"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.mypy]
files = ["harnessmith"]
python_version = "3.9"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
disable_error_code = ["arg-type", "attr-defined", "call-overload", "index"]

[tool.ruff]
target-version = "py39"
line-length = 88
exclude = ["examples/compiled", "fixtures/sources"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
