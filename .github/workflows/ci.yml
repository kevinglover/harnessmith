---
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Byte-compile sources
        run: python -m compileall -q harnessmith tests scripts
  quality:
    name: Quality and repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Test with coverage
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report
      - name: Validate schemas and documentation links
        run: python scripts/check_repository.py all
      - name: Validate fixture corpus
        run: python -m unittest -v tests.test_fixture_corpus
      - name: Verify generated example is current
        run: |
          output="${RUNNER_TEMP}/speckit-analyze"
          python -m harnessmith skills/speckit-analyze \
            --recipe recipes/speckit-analyze.cursor.json \
            --output "${output}"
          diff -ru examples/compiled/cursor/speckit-analyze "${output}"
  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Smoke-test installed wheel
        run: |
          expected_version="$(python -c 'import harnessmith; print(harnessmith.__version__)')"
          python -m venv "${RUNNER_TEMP}/wheel-test"
          "${RUNNER_TEMP}/wheel-test/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/wheel-test/bin/harnessmith" --help
          EXPECTED_VERSION="${expected_version}" \
            "${RUNNER_TEMP}/wheel-test/bin/python" -c \
            'import os, harnessmith; assert harnessmith.__version__ == os.environ["EXPECTED_VERSION"]'
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
  required:
    name: CI required
    if: always()
    needs: [tests, quality, package]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm required jobs passed
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "${TESTS_RESULT}" = success
          test "${QUALITY_RESULT}" = success
          test "${PACKAGE_RESULT}" = success
