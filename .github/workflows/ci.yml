---
name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:workflow_dispatch inputs are required for manual runs
    inputs:
      workflow:
        required: true
        type: choice
        options:
          - update
        description: Choose the workflow to run
        default: update
permissions:
  contents: read

jobs:
  speckit-init:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.workflow == 'update'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/speckit-init.yml
    with:
      ai-assistants: codex,agy,cursor-agent,copilot,opencode,claude
      version-md-file-to-write: VERSION.md
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  compiler-tests:
    if: >
      github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.x"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Byte-compile sources
        run: python -m compileall -q harnessmith tests
      - name: Verify generated example
        if: matrix.python-version == '3.x'
        run: |
          output="${RUNNER_TEMP}/speckit-analyze"
          python -m harnessmith skills/speckit-analyze \
            --recipe recipes/speckit-analyze.cursor.json \
            --output "${output}"
          diff -ru examples/compiled/cursor/speckit-analyze "${output}"

  markdown-lint:
    if: >
      github.event_name == 'push' || github.event_name == 'pull_request'
    uses: dceoy/gha-for-devops/.github/workflows/markdown-lint.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      search-path: .
  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    needs:
      - markdown-lint
      - compiler-tests
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    uses: dceoy/gha-for-devops/.github/workflows/dependabot-auto-merge.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      unconditional: true
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
